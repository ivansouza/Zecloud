<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cauldron — fire.html</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  color: #e5eefc;
  background: #03050d;
}
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="sh"></canvas>

<script>
// ── Cauldron shader (f z, d) ─────────────────────────────────────
const shader = `
Cauldron
f z, d
@(40)
{
  f3 p = z * nor(2*C.rgb - R.xyy)
  p.zy+=3
  d=2; @(7) d/=.8,
  p +=.6*p.y*cos(p.yzx * d - f3(T,,)*6) / d
  z += d = .02 + abs(len(p.xz) + p.y*.4 -1) / 9
  O += (sin(f4(5,0,2,)-p.y) + 2) / d
}
O = tanh(O*O / 15e5)
`;

// ── WebGL renderer ───────────────────────────────────────────────
const canvas = document.getElementById('sh');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const gl = canvas.getContext('webgl');
if (!gl) { alert('WebGL not supported'); }

const vs = `
attribute vec2 a_pos;
void main() {
  gl_Position = vec4(a_pos, 0.0, 1.0);
}
`;

const fs = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;

${shader.replace(/\n/g, '\n')}

void main() {
  float t = u_time * 0.001;
  vec2 uv = gl_FragCoord.xy / u_res;

  // p = z * nor(2*C.rgb - R.xyy)
  vec3 c = vec3(0.0);
  float z = 0.5 + 0.5 * sin(t * 0.7);
  vec3 r = vec3(uv.x, uv.y, 0.5);
  c = z * normalize(r);

  // p.zy += 3
  c.y += 3.0;

  // d = 2; @(7) d /= .8
  float d = 2.0 / 0.8;

  // p += .6 * p.y * cos(p.yzx * d - f3(T,,) * 6) / d
  float p = c.x;
  p += 0.6 * c.y * cos(c.z * d - 1.0 * 6.0) / d;

  // z += d = .02 + abs(len(p.xz) + p.y*.4 - 1) / 9
  float z2 = 0.02 + abs(c.x + c.y * 0.4 - 1.0) / 9.0;
  z += z2;

  // O += (sin(f4(5,0,2,) - p.y) + 2) / d
  float o = sin(5.0 + 0.0 * 0.0 - c.y) + 2.0;
  o /= d;

  float val = clamp(o, 0.0, 1.0);
  gl_FragColor = vec4(val, val * 0.6, 0.3, 1.0);
}
`;

const program = gl.createProgram();
gl.compileShader(gl.VERTEX_SHADER);
gl.attachShader(program, gl.VERTEX_SHADER);
gl.attachShader(program, gl.FRAGMENT_SHADER);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error('Link error:', gl.getProgramInfoLog(program));
}

gl.useProgram(program);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(program, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(program, 'u_res');
const uTime = gl.getUniformLocation(program, 'u_time');

let t = 0;
function render() {
  t += 0.016;
  gl.uniform2f(uRes, canvas.width / 300, canvas.height / 300);
  gl.uniform1f(uTime, t);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
